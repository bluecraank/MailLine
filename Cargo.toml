[package]
name = "mailline"
version = "0.3.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
dirs = "7.0.0"
hex = "0.4.3"
imap = "2.4.1"
keyring = { version = "3", features = ["windows-native"] }
lettre = "0.11.23"
mail-parser = "1.0.1"
native-tls = "0.2.18"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tauri = "2"
tauri-plugin-single-instance = "2"
ureq = { version = "3.5.1", features = ["json"] }

[build-dependencies]
tauri-build = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = "=0.62.2"
