[package]
name = "mailline"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
dirs = "7.0.0"
imap = "2.4.1"
keyring = { version = "3", features = ["windows-native"] }
lettre = "0.11.23"
mail-parser = "1.0.1"
native-tls = "0.2.18"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2"

[build-dependencies]
tauri-build = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
